<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฐนน เพ็ญวิเชียร</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- ฟอนต์ชั่วคราว: Noto Sans Thai (UI) + Mali (ลายมือบนกระดาน) — จะเปลี่ยนเมื่อเลือกฟอนต์จริงแล้ว -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;800;900&family=Mali:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=30">
  <link rel="stylesheet" href="css/scene-refinement.css?v=30">
</head>
<body class="is-loading">

  <!-- 0. LOADING -->
  <div id="loader" aria-live="polite">
    <img class="loader-logo" src="assets/logo.png" alt="">
    <div class="loader-pct"><span id="loader-num">0</span>%</div>
  </div>

  <!-- ===== UI ติดจอ ===== -->
  <button id="logo-btn" class="ui" aria-label="กลับขึ้นบนสุด"><img src="assets/logo.png" alt=""></button>

  <div id="top-right" class="ui">
    <button id="sound-btn" aria-label="เปิดเสียง" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" />
        <g class="on"><path d="M16 9c1.3 1.6 1.3 4.4 0 6" /><path d="M18.5 6.5c2.8 3 2.8 8 0 11" /></g>
        <g class="off"><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" /></g>
      </svg>
    </button>
    <button id="menu-btn" aria-label="เมนู" aria-expanded="false"><i></i><i></i></button>
  </div>
  <nav id="menu" aria-hidden="true"><ul id="menu-list"></ul></nav>

  <button id="play-btn" class="ui" aria-pressed="false">✏️ <span>โหมดเล่น</span></button>

  <nav id="topnav" class="ui" aria-label="เส้นทาง">
    <ol id="nav-items"></ol>
    <div id="nav-track" aria-hidden="true"><i id="nav-fill"></i><i id="nav-dot"></i></div>
  </nav>

  <main>
    <section id="story">
      <div class="stage">
        <!-- ห้องเรียน (SVG) -->
        <div id="classroom">
          <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-label="ห้องเรียน"></svg>
          <div class="s3-text"><p id="path-line"></p></div>
          <p class="play-hint" id="play-hint">ลองหยิบปากกาปา · ขีดเขียนบนหนังสือ · จับหัวดึงดู</p>
        </div>

        <!-- กระดาน -->
        <div id="board-layer">
          <div id="board">
            <div id="board-surface">
              <div id="slides"></div>
              <canvas id="board-ink"></canvas>
              <canvas id="board-wipe"></canvas>
            </div>
            <div id="board-tray"></div>
          </div>
          <div id="eraser" aria-label="แปรงลบกระดาน">
            <svg viewBox="0 0 220 90" aria-hidden="true">
              <rect x="6" y="6" width="208" height="54" rx="10" fill="#fff" stroke="#111" stroke-width="5" />
              <rect x="6" y="56" width="208" height="26" rx="6" fill="#2b2b2b" stroke="#111" stroke-width="5" />
              <text x="110" y="42" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-weight="800" font-size="24" fill="#111">แปรงลบกระดาน</text>
            </svg>
          </div>
          <div id="chalk-dust" aria-hidden="true"></div>
        </div>

        <!-- เวลาผ่านไป: หน้าปฏิทินหลุดตามการเลื่อน -->
        <div id="time-layer" aria-hidden="true">
          <div class="time-copy"><small>จากวันนั้น</small><strong>เวลาเริ่มเดินต่อ</strong></div>
          <div id="calendar-stack"></div>
        </div>

        <!-- ห้องทำงาน + จอผลงาน -->
        <div id="workspace-layer">
          <div class="room-tone" aria-hidden="true"></div>
          <div class="room-caption"><small>3 ปีต่อมา</small><strong>ผมยังนั่งอยู่หน้าจอ<br>แต่ครั้งนี้ ผมกำลังสร้างเกม</strong></div>
          <div id="work-desk" aria-hidden="true"><i></i></div>
          <div id="work-chair" aria-hidden="true">
            <img class="work-pose work-back" src="assets/characters/student-back.png" alt="">
            <img class="work-pose work-turned" src="assets/characters/student-turn.png" alt="">
          </div>
          <div id="monitor-shell">
            <div class="monitor-bezel">
              <div class="monitor-camera"></div>
              <div id="monitor-screen"><div id="portfolio-track"></div></div>
              <div class="monitor-brand">NOK MAKE GAME</div>
            </div>
            <div class="monitor-stand"></div>
          </div>
          <p class="turn-hint">เลื่อนต่อเพื่อให้ผมหันมา</p>
        </div>

        <!-- มาสคอตโผล่ขอบจอ (จับ/ดัน/ยกได้) -->
        <img id="mascot" src="assets/mascot/cross.png" alt="มาสคอต" draggable="false">

        <!-- Opening แบบ Heal -->
        <div id="opening">
          <div id="opening-lines"></div>
          <div class="scroll-hint"><span id="scroll-hint-text"></span><i></i></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/content.js?v=30"></script>
  <script src="js/sound.js?v=30"></script>
  <script src="js/effects.js?v=30"></script>
  <script src="js/scene.js?v=30"></script>
  <script src="js/character.js?v=30"></script>
  <script src="js/board.js?v=30"></script>
  <script src="js/mascot.js?v=30"></script>
  <script src="js/workspace.js?v=30"></script>
  <script src="js/main.js?v=30"></script>
</body>
</html>
